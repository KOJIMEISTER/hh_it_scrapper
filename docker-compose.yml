services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 546258
      MONGO_INITDB_DATABASE: vacancy_db
    volumes:
      - ./mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - mongodb_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://root:546258@localhost:27017/vacancy_db?authSource=admin --quiet
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: vacancy_app
    profiles:
      - cli_only
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://root:546258@mongodb:27017/vacancy_db?authSource=admin
      - BEARER_TOKEN=${BEARER_TOKEN} # Ensures BEARER_TOKEN is loaded from .env
      - DOWNLOAD_30_DAYS=${DOWNLOAD_30_DAYS}
    volumes:
      - ./logs:/app/logs
    networks:
      - mongodb_network

networks:
  mongodb_network:
    driver: bridge
